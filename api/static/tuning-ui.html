<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuning Panel</title>
  <style>
    :root { --bg:#f3f6fb; --panel:#ffffff; --line:#dbe3f1; --text:#1e2a43; --muted:#62708a; --brand:#2d6cdf; --ok:#1d9d5b; --warn:#d39e00; --bad:#d64545; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "SF Pro Text","PingFang SC","Segoe UI",Arial,sans-serif; color:var(--text); background:var(--bg); }
    .page { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius: 10px; padding: 12px; }
    .panel h3 { margin: 0 0 10px; font-size: 16px; }
    .field { display:grid; grid-template-columns: 230px 1fr; gap:8px; align-items:center; margin: 7px 0; }
    .field label { color: var(--muted); font-size: 12px; }
    .field input, .field select, .field textarea { width:100%; border:1px solid var(--line); border-radius: 8px; padding: 7px; font-size: 13px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn { border:1px solid #b6c7e6; background:#ecf2ff; color:#20458d; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600; }
    .btn:hover { filter: brightness(0.98); }
    .status { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .result { margin-top: 12px; }
    .cards { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; }
    .card h4 { margin:0 0 6px; font-size:14px; }
    .metric { display:grid; grid-template-columns: 1fr auto; gap:4px; font-size: 12px; }
    .metric div:nth-child(odd) { color: var(--muted); }
    .split { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top:12px; }
    .bar-row { margin:8px 0; }
    .bar-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .bar-wrap { width:100%; background:#eef3fb; border-radius:999px; overflow:hidden; border:1px solid #dde6f6; }
    .bar { height:12px; background: linear-gradient(90deg, #5b8dff, #2d6cdf); width: 0%; transition: width .25s; }
    .badge { display:inline-block; padding:4px 8px; border-radius:999px; font-size:12px; font-weight:700; }
    .badge.good { background:#e8f8ef; color:var(--ok); }
    .badge.ok { background:#fff6df; color:var(--warn); }
    .badge.bad { background:#ffe9e9; color:var(--bad); }
    details { margin-top: 10px; border:1px solid var(--line); border-radius:8px; padding:8px; background:#fff; }
    summary { cursor:pointer; font-weight:600; }
    pre { white-space: pre-wrap; word-break: break-word; border:1px solid var(--line); border-radius:8px; padding:8px; background:#f8fbff; font-size: 12px; }
    @media (max-width: 980px) { .grid, .split, .cards { grid-template-columns: 1fr; } .field { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="h1">Tuning Panel / Benchmark Runner</div>
    <div class="sub">内部 MVP 调试面板（非生产后台）</div>

    <div class="grid">
      <section class="panel">
        <h3>[Tuning Panel] 参数区</h3>
        <div class="field"><label>clarity_penalty_weight</label><input id="clarityPenalty" type="number" step="0.1"></div>
        <div class="field"><label>constraint_penalty_weight</label><input id="constraintPenalty" type="number" step="0.1"></div>
        <div class="field"><label>reward_multiplier</label><input id="rewardMultiplier" type="number" step="0.1"></div>
        <div class="field"><label>effort_weight (optional)</label><input id="effortWeight" type="number" step="0.1"></div>
        <div class="field"><label>obedience_weight (optional)</label><input id="obedienceWeight" type="number" step="0.1"></div>
        <div class="field"><label>initiative_weight (optional)</label><input id="initiativeWeight" type="number" step="0.1"></div>
        <div class="field"><label>token_budget.task_multiplier</label><input id="taskBudget" type="number" step="0.1"></div>
        <div class="field"><label>token_budget.agent_multiplier</label><input id="agentBudget" type="number" step="0.1"></div>
        <div class="field"><label>artificial_delay_ms (global)</label><input id="delayMs" type="number" min="0" step="1"></div>
        <div class="field"><label>cost_weight (global)</label><input id="costWeight" type="number" min="0" step="0.1"></div>
        <div class="row">
          <button class="btn" id="reloadBtn">Reload</button>
          <button class="btn" id="saveBtn">Apply / Save</button>
        </div>
        <div id="tuningStatus" class="status"></div>
      </section>

      <section class="panel">
        <h3>[Benchmark Runner] 测试区</h3>
				<div class="field"><label>Task</label><input id="taskId" value="tsk_assess_a_city_launch_for_d9bbd92d"></div>
        <div class="field">
          <label>Agents</label>
          <div class="row">
            <label><input type="checkbox" class="agent" value="junior" checked> junior</label>
						<label><input type="checkbox" class="agent" value="mid"> mid</label>
						<label><input type="checkbox" class="agent" value="senior" checked> senior</label>
          </div>
        </div>
        <div class="field">
          <label>Instruction</label>
          <div class="row">
            <label><input type="checkbox" id="useVague" checked> vague</label>
            <label><input type="checkbox" id="useClear" checked> clear</label>
          </div>
        </div>
        <div class="field"><label>vague text</label><textarea id="vagueText" rows="2">Do a quick plan.</textarea></div>
        <div class="field"><label>clear text</label><textarea id="clearText" rows="2">Targeting urban professionals. Include pricing, risk factors and milestones.</textarea></div>
        <div class="field"><label>Models (comma optional)</label><input id="models" placeholder="mvp-default"></div>
        <div class="field"><label>Repeats</label><input id="repeats" type="number" min="1" max="20" value="1"></div>
        <div class="row"><button class="btn" id="runBtn">Run Benchmark</button></div>
        <div id="benchStatus" class="status"></div>
      </section>
    </div>

    <section class="panel result">
      <h3>[结果展示区]</h3>
      <div class="cards" id="summaryCards"></div>
      <div class="split">
        <div>
          <h4>2️⃣ gap 可视化（关键）</h4>
          <div class="bar-row"><div class="bar-label">clarity gap - junior: <span id="jGapText">0</span></div><div class="bar-wrap"><div id="jGapBar" class="bar"></div></div></div>
          <div class="bar-row"><div class="bar-label">clarity gap - senior: <span id="sGapText">0</span></div><div class="bar-wrap"><div id="sGapBar" class="bar"></div></div></div>
          <div class="bar-row"><div class="bar-label">agent gap - vague: <span id="vGapText">0</span></div><div class="bar-wrap"><div id="vGapBar" class="bar"></div></div></div>
          <div class="bar-row"><div class="bar-label">agent gap - clear: <span id="cGapText">0</span></div><div class="bar-wrap"><div id="cGapBar" class="bar"></div></div></div>
        </div>
        <div>
          <h4>⭐ 推荐指数</h4>
          <div id="recommendBadge" class="badge ok">OK</div>
          <div id="recommendReason" class="status"></div>
        </div>
      </div>
      <h4 style="margin-top:12px;">3️⃣ 单条结果（可展开）</h4>
      <div id="runDetails"></div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const toNum = (v, d=null) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
    const pickAgents = () => Array.from(document.querySelectorAll('.agent:checked')).map(x => x.value);
    const pickModels = () => ($('models').value || '').split(',').map(s => s.trim()).filter(Boolean);

    function getVariantMap() {
      const out = {};
      if ($('useVague').checked) out.vague = $('vagueText').value || 'Do a quick plan.';
      if ($('useClear').checked) out.clear = $('clearText').value || 'Targeting urban professionals. Include pricing and risk.';
      return out;
    }

    async function loadTuning() {
      $('tuningStatus').textContent = 'Loading tuning...';
      const res = await fetch('http://127.0.0.1:8000/debug/tuning');
      const data = await res.json();
      const p = data.effective_parameters || {};
      const t = p.agent_trait_weights || {};
      const b = p.token_budget || {};
      $('clarityPenalty').value = p.clarity_penalty_weight ?? '';
      $('constraintPenalty').value = p.constraint_penalty_weight ?? '';
      $('rewardMultiplier').value = p.reward_multiplier ?? '';
      $('effortWeight').value = t.effort ?? '';
      $('obedienceWeight').value = t.obedience ?? '';
      $('initiativeWeight').value = t.initiative ?? '';
      $('taskBudget').value = b.task_multiplier ?? '';
      $('agentBudget').value = b.agent_multiplier ?? '';
      $('delayMs').value = p.artificial_delay_ms ?? '';
      $('costWeight').value = p.cost_weight ?? '';
      $('tuningStatus').textContent = 'Loaded.';
    }

    async function saveTuning() {
      const payload = {
        clarity_penalty_weight: toNum($('clarityPenalty').value),
        constraint_penalty_weight: toNum($('constraintPenalty').value),
        reward_multiplier: toNum($('rewardMultiplier').value),
        agent_trait_weights: {
          effort: toNum($('effortWeight').value),
          obedience: toNum($('obedienceWeight').value),
          initiative: toNum($('initiativeWeight').value),
        },
        token_budget: {
          task_multiplier: toNum($('taskBudget').value),
          agent_multiplier: toNum($('agentBudget').value),
        },
        artificial_delay_ms: toNum($('delayMs').value),
        cost_weight: toNum($('costWeight').value),
      };
      $('tuningStatus').textContent = 'Applying...';
      const res = await fetch('http://127.0.0.1:8000/debug/tuning', { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      if (!res.ok) {
        $('tuningStatus').textContent = 'Failed: ' + await res.text();
        return;
      }
      $('tuningStatus').textContent = 'Applied.';
      await loadTuning();
    }

    function avg(arr) { return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
    function byKey(runs, level, variant) { return runs.filter(r => r.agent_level===level && r.instruction_variant===variant); }
    function scoreAvg(runs, level, variant) { return avg(byKey(runs, level, variant).map(r => Number(r.metrics?.final_score || 0))); }

    function cardHtml(title, run) {
      const m = run?.metrics || {};
      return `
        <div class="card">
          <h4>${title}: ${Number(m.final_score || 0).toFixed(1)}</h4>
          <div class="metric">
            <div>clarity_score</div><div>${run?.clarity_score ?? '-'}</div>
            <div>constraint_hits</div><div>${(run?.constraint_hits || []).join(' / ') || '-'}</div>
            <div>constraint_misses</div><div>${(run?.constraint_misses || []).join(' / ') || '-'}</div>
            <div>token_usage</div><div>${m.token_usage ? m.token_usage.total_tokens : '-'}</div>
            <div>cost</div><div>${m.cost ?? '-'}</div>
            <div>latency_ms</div><div>${m.latency_ms ?? '-'}</div>
          </div>
        </div>
      `;
    }

    function setBar(id, value, maxAbs=40) {
      const w = Math.min(100, Math.max(0, Math.abs(value) / maxAbs * 100));
      $(id).style.width = `${w}%`;
    }

    function renderRecommendation(jGap, sGap, vGap, cGap, allScores) {
      const clarityGood = (jGap > 15) && (sGap > 15);
      const seniorGood = (vGap > 0) && (cGap > 0);
      const minS = Math.min(...allScores), maxS = Math.max(...allScores), range = maxS - minS;
      const distributionGood = (minS >= 0) && (maxS <= 100) && (range >= 15) && (range <= 90);
      const pass = [clarityGood, seniorGood, distributionGood].filter(Boolean).length;
      let tag = 'BAD'; let cls = 'bad';
      if (pass === 3) { tag = 'GOOD'; cls = 'good'; }
      else if (pass === 2) { tag = 'OK'; cls = 'ok'; }
      $('recommendBadge').className = `badge ${cls}`;
      $('recommendBadge').textContent = tag;
      $('recommendReason').textContent = `clarity>${clarityGood?'OK':'NO'} | senior>${seniorGood?'OK':'NO'} | distribution>${distributionGood?'OK':'NO'}`;
    }

    function renderRunDetails(runs) {
      $('runDetails').innerHTML = runs.map((r, idx) => `
        <details>
          <summary>[ ${r.agent_level} + ${r.instruction_variant} ] score=${Number(r.metrics?.final_score || 0).toFixed(1)}</summary>
          <div class="status">hits: ${(r.constraint_hits || []).join(' / ') || '-'}</div>
          <div class="status">misses: ${(r.constraint_misses || []).join(' / ') || '-'}</div>
          <div class="status">raw_output_preview</div>
          <pre>${r.raw_output_preview || ''}</pre>
          <div class="status">score_breakdown</div>
          <pre>${JSON.stringify(r.score_breakdown || {}, null, 2)}</pre>
        </details>
      `).join('');
    }

    async function runBenchmark() {
      const payload = {
        task_id: $('taskId').value.trim(),
        agent_levels: pickAgents(),
        models: pickModels(),
        user_instruction_variants: getVariantMap(),
        repeats: Number($('repeats').value || 3),
      };
      $('benchStatus').textContent = 'Running benchmark...';
      const res = await fetch('http://127.0.0.1:8000/debug/benchmark', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      if (!res.ok) {
        $('benchStatus').textContent = 'Failed: ' + await res.text();
        return;
      }
      const data = await res.json();
      const runs = data.runs || [];
      const jv = byKey(runs, 'junior', 'vague')[0];
      const jc = byKey(runs, 'junior', 'clear')[0];
      const sv = byKey(runs, 'senior', 'vague')[0];
      const sc = byKey(runs, 'senior', 'clear')[0];
      $('summaryCards').innerHTML = [
        cardHtml('junior vague', jv),
        cardHtml('junior clear', jc),
        cardHtml('senior vague', sv),
        cardHtml('senior clear', sc),
      ].join('');

      const jvAvg = scoreAvg(runs, 'junior', 'vague');
      const jcAvg = scoreAvg(runs, 'junior', 'clear');
      const svAvg = scoreAvg(runs, 'senior', 'vague');
      const scAvg = scoreAvg(runs, 'senior', 'clear');

      const juniorGap = jcAvg - jvAvg;
      const seniorGap = scAvg - svAvg;
      const vagueGap = svAvg - jvAvg;
      const clearGap = scAvg - jcAvg;
      $('jGapText').textContent = juniorGap.toFixed(1);
      $('sGapText').textContent = seniorGap.toFixed(1);
      $('vGapText').textContent = vagueGap.toFixed(1);
      $('cGapText').textContent = clearGap.toFixed(1);
      setBar('jGapBar', juniorGap);
      setBar('sGapBar', seniorGap);
      setBar('vGapBar', vagueGap);
      setBar('cGapBar', clearGap);
      renderRecommendation(juniorGap, seniorGap, vagueGap, clearGap, runs.map(r => Number(r.metrics?.final_score || 0)));
      renderRunDetails(runs);
      $('benchStatus').textContent = `Done. runs=${runs.length}`;
    }

    $('reloadBtn').addEventListener('click', loadTuning);
    $('saveBtn').addEventListener('click', saveTuning);
    $('runBtn').addEventListener('click', runBenchmark);
    loadTuning();
  </script>
</body>
</html>
